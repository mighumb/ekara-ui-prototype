# Publish static site to branch `gh-pages` (production + PR previews).
#
# One-time (repo admin): Settings → Pages → Build and deployment
#   → Source: Deploy from branch → Branch: gh-pages → Folder: / (root)
#
# Preview URL (PR #N) — use a screen path, not the folder root (landing hub):
#   https://mighumb.github.io/ekara-ui-prototype/previews/pr-N/settings/rum/trackers/
# Production (after merge to main):
#   https://mighumb.github.io/ekara-ui-prototype/

name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  publish-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish PR preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          target-folder: previews/pr-${{ github.event.pull_request.number }}
          clean: false

  comment-preview:
    if: github.event_name == 'pull_request'
    needs: publish-preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const base = 'https://mighumb.github.io/ekara-ui-prototype';
            const url = `${base}/previews/pr-${prNumber}/`;
            const marker = '<!-- ekara-pages-preview -->';

            const { data: prFiles } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            function isVersionBumpOnlyLine(line) {
              const t = line.replace(/^[-+]/, '').trim();
              if (!t) return true;
              return (
                /tokens\.css\?v=\d+/.test(t) ||
                /ekara\.css\?v=\d+/.test(t) ||
                /assetVersion\s*=\s*'\d+'/.test(t)
              );
            }

            function isVersionBumpOnlyFile(file) {
              const { patch } = file;
              if (!patch) return false;
              const hunks = patch.split('\n').filter((l) => l.startsWith('+') || l.startsWith('-'));
              if (!hunks.length) return false;
              return hunks.every(isVersionBumpOnlyLine);
            }

            const substantiveFilenames = prFiles
              .filter((file) => !isVersionBumpOnlyFile(file))
              .map((file) => file.filename);

            const screens = [
              {
                label: 'RUM Trackers (Settings)',
                path: 'settings/rum/trackers/',
                match: (f) =>
                  f.startsWith('settings/rum/trackers/') ||
                  f === 'assets/js/rum-trackers.js' ||
                  f === 'assets/js/settings-sidebar.js' ||
                  f.startsWith('tests/e2e/rum-trackers'),
              },
              {
                label: 'Alert rules (Settings)',
                path: 'settings/alerts/',
                match: (f) =>
                  f.startsWith('settings/alerts/') ||
                  f === 'assets/js/alerts.js' ||
                  f === 'assets/js/settings-sidebar.js' ||
                  f.startsWith('tests/e2e/alerts'),
              },
              {
                label: 'Webhooks (Management)',
                path: 'webhooks/',
                match: (f) =>
                  f.startsWith('webhooks/') ||
                  f === 'assets/js/webhooks.js' ||
                  f.startsWith('tests/e2e/webhooks'),
              },
              {
                label: 'RUM user journey mapping (Measures)',
                path: 'measures/explore/rum/user-journey-mapping/',
                match: (f) =>
                  f.startsWith('measures/explore/rum/user-journey-mapping/') ||
                  f === 'assets/js/rum-user-journey.js' ||
                  f.startsWith('tests/e2e/rum-journey'),
              },
            ];

            const previewLinks = screens.filter((s) =>
              substantiveFilenames.some((f) => s.match(f)),
            );
            const linkLines =
              previewLinks.length > 0
                ? previewLinks.map((s) => `- [${s.label}](${url}${s.path})`)
                : [`- [Prototype hub](${url})`];

            const body = [
              marker,
              `### Ekara UI prototype — preview PR #${prNumber}`,
              '',
              'Prerequisite: publish GitHub Pages from the `gh-pages` branch (see README).',
              '',
              previewLinks.length === 1
                ? `**Preview this PR:** ${url}${previewLinks[0].path}`
                : '**Preview (screens changed in this PR):**',
              ...linkLines,
              '',
              '_Updated on each push to this branch._',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  publish-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish production to gh-pages (keep previews)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          clean: true
          clean-exclude: |
            previews/**
