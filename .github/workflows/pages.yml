# Publish static site to branch `gh-pages` (production + PR previews).
#
# One-time (repo admin): Settings → Pages → Build and deployment
#   → Source: Deploy from branch → Branch: gh-pages → Folder: / (root)
#
# Preview URL (PR #N):
#   https://mighumb.github.io/ekara-ui-prototype/previews/pr-N/settings/alerts/
# Production (after merge to main):
#   https://mighumb.github.io/ekara-ui-prototype/

name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  publish-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish PR preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          target-folder: previews/pr-${{ github.event.pull_request.number }}
          clean: false

  comment-preview:
    if: github.event_name == 'pull_request'
    needs: publish-preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const base = 'https://mighumb.github.io/ekara-ui-prototype';
            const url = `${base}/previews/pr-${prNumber}/`;
            const marker = '<!-- ekara-pages-preview -->';
            const body = `${marker}
### Ekara UI prototype — preview PR #${prNumber}

**Prérequis :** Pages doit être publiée depuis la branche \`gh-pages\` (voir README).

**Preview :** ${url}

- [Alert rules (Settings)](${url}settings/alerts/)
- [Webhooks (Management)](${url}webhooks/)

_Mis à jour à chaque push sur cette branche._
`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  publish-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish production to gh-pages (keep previews)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          clean: true
          clean-exclude: |
            previews/**
