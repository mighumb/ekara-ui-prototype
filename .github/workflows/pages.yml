# Static site: production (main) + PR previews via GitHub Pages (Actions).
# One-time repo setting: Settings → Pages → Build and deployment → Source: GitHub Actions.
# On a PR: open the workflow run → environment "github-pages" → View deployment (preview URL).

name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  comment-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ needs.deploy.outputs.page_url }}';
            const prNumber = context.payload.pull_request.number;
            const marker = '<!-- ekara-pages-preview -->';
            const body = `${marker}
            ### Ekara UI prototype — PR preview

            **Preview URL:** ${url}

            Try navigation:
            - [Alert rules (Settings)](${url}settings/alerts/)
            - [Webhooks (Management)](${url}webhooks/)

            _Updated on each push to this branch. Production stays on \`main\` until merge._
            `;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
