<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekara UI Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css?v=146">
  <link rel="stylesheet" href="assets/css/ekara.css?v=146">
  <script src="assets/js/prototype-routes.js?v=1"></script>
  <script>
    (function () {
      if (new URLSearchParams(window.location.search).get('hub') === '1') return;
      var routes = window.EkaraPrototypeRoutes;
      if (!routes) return;
      window.location.replace(routes.resolve(routes.defaultEntry));
    })();
  </script>
</head>
<body class="landing-page">
  <div class="landing">
    <h1>Ekara UI Prototype</h1>
    <p>Interactive HTML prototype for UX validation and dev handoff.</p>
    <p class="landing-hint">Production opens the default Measures screen. Use this hub only with <code>?hub=1</code>.</p>
    <div class="landing-actions">
      <a href="measures/explore/rum/user-journey-mapping/" class="btn btn-primary">RUM user journey mapping (Measures)</a>
      <a href="webhooks/" class="btn btn-outline">Webhooks (Management)</a>
      <a href="settings/alerts/" class="btn btn-outline">Alert rules (Settings)</a>
      <a href="settings/rum/trackers/" class="btn btn-outline">RUM Trackers (Settings)</a>
    </div>
  </div>
</body>
</html>
