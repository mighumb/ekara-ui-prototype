<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert rules — Ekara Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=151">
  <link rel="stylesheet" href="../../assets/css/ekara.css?v=151">
</head>
<body data-settings-screen="alerts">
  <div class="app-layout">
    <header class="topbar">
      <div class="topbar-left">
        <img src="../../assets/images/ekara-logo.svg" alt="" class="topbar-logo" width="32" height="32">
        <div class="topbar-breadcrumb">
          Settings | <span>Alerts</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-account">
          My account
          <svg width="10" height="6" viewBox="0 0 10 6" fill="currentColor"><path d="M1 1l4 4 4-4"/></svg>
        </div>
        <button class="topbar-icon-btn" aria-label="Help">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
        <button class="topbar-icon-btn" aria-label="Notifications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="topbar-badge"></span>
        </button>
        <div class="topbar-avatar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v1h20v-1c0-3.3-6.7-5-10-5z"/></svg>
        </div>
        <div class="bento-menu-wrap">
          <button type="button" class="topbar-icon-btn" id="btn-bento" aria-label="Modules" aria-expanded="false" aria-haspopup="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/>
              <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
              <circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
            </svg>
          </button>
          <div class="bento-menu" id="bento-menu" hidden>
            <button type="button" class="bento-menu-item" data-module="Measures">
              <svg class="bento-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                <path d="M4 19V10"/><path d="M9 19V5"/><path d="M14 19v-7"/><path d="M19 19V8"/>
                <circle cx="18" cy="6" r="3"/>
              </svg>
              <span>Measures</span>
            </button>
            <button type="button" class="bento-menu-item" data-module="Infrastructure">
              <svg class="bento-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                <circle cx="12" cy="18" r="2"/><circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/>
                <path d="M12 16V10"/><path d="M6 8v2a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4V8"/>
              </svg>
              <span>Infrastructure</span>
            </button>
            <button type="button" class="bento-menu-item active" data-module="Settings" aria-current="page">
              <svg class="bento-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
              <span>Settings</span>
            </button>
            <button type="button" class="bento-menu-item" data-module="Management">
              <svg class="bento-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                <circle cx="12" cy="8" r="3.5"/>
                <path d="M5.5 20c1.6-3.2 4.2-5 6.5-5s4.9 1.8 6.5 5"/>
              </svg>
              <span>Management</span>
            </button>
            <button type="button" class="bento-menu-item" data-module="Ekara Green">
              <svg class="bento-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                <path d="M5 19c8-1 12-8 13-14-6 1-12 5-13 14Z"/>
                <path d="M8 14c2-2 5-4 9-5"/>
              </svg>
              <span>Ekara Green</span>
            </button>
            <button type="button" class="bento-menu-item" data-module="Incident Guard">
              <svg class="bento-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                <path d="M12 3 5 6v5c0 5 3.5 8.5 7 10 3.5-1.5 7-5 7-10V6l-7-3Z"/>
                <circle cx="12" cy="12" r="2"/>
              </svg>
              <span>Incident Guard</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <aside class="sidebar" data-ekara-settings-sidebar></aside>

    <main class="main-content main-content--list-table">
      <div class="page-header">
        <h1 class="page-title">Alert rules</h1>
        <button type="button" class="btn btn-primary" id="btn-add-alert">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add an alert
        </button>
      </div>

      <div class="data-table-viewport">
      <div class="data-table data-table--alerts data-table--scroll">
        <div class="data-table-header">
          <div class="data-table-header-cell"></div>
          <div class="data-table-header-cell">
            <button type="button" class="data-table-header-sort" data-sort-key="name" aria-sort="none">
              <span class="data-table-header-sort-label">Name</span>
              <span class="data-table-header-sort-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="data-table-header-cell">
            <button type="button" class="data-table-header-sort" data-sort-key="description" aria-sort="none">
              <span class="data-table-header-sort-label">Description</span>
              <span class="data-table-header-sort-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="data-table-header-cell">
            <button type="button" class="data-table-header-sort" data-sort-key="applications" aria-sort="none">
              <span class="data-table-header-sort-label">Associated application(s)</span>
              <span class="data-table-header-sort-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="data-table-header-cell">
            <button type="button" class="data-table-header-sort" data-sort-key="trigger" aria-sort="none">
              <span class="data-table-header-sort-label">Trigger event</span>
              <span class="data-table-header-sort-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="data-table-header-cell">
            <button type="button" class="data-table-header-sort" data-sort-key="recipients" aria-sort="none">
              <span class="data-table-header-sort-label">Recipients</span>
              <span class="data-table-header-sort-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="data-table-header-cell">
            <button type="button" class="data-table-header-sort" data-sort-key="scenarios" aria-sort="none">
              <span class="data-table-header-sort-label">Associated scenarios</span>
              <span class="data-table-header-sort-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="data-table-header-cell"></div>
        </div>
        <div class="data-table-body-scroll">
          <div id="alert-table-body"></div>
        </div>
      </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modal-overlay"></div>

  <div class="slide-panel" id="slide-panel">
    <div class="slide-panel-header">
      <h2 class="slide-panel-title" id="panel-title">New alert</h2>
      <button type="button" class="slide-panel-close" id="panel-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="slide-panel-body">
      <form id="alert-form" class="alert-form" onsubmit="return false;">
        <div class="form-group">
          <label class="form-label" for="field-name">Name</label>
          <input type="text" class="form-input" id="field-name" placeholder="Alert rule name">
          <div class="form-error" id="error-name"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="field-description">Description</label>
          <div class="textarea-wrap">
            <textarea class="form-textarea" id="field-description" maxlength="250" placeholder="Alert rule description" rows="3"></textarea>
            <span class="char-counter" id="char-counter">0 / 250</span>
          </div>
        </div>

        <hr class="section-divider">

        <div class="form-row-inline-2 form-row-align-start alert-scope-row">
          <div class="form-group alert-global-field">
            <span class="form-label">Global</span>
            <label class="toggle">
              <input type="checkbox" id="field-global" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="form-group">
            <span class="form-label">Applications</span>
            <div class="applications-control-slot">
              <div id="applications-global-wrap">
                <div class="form-input form-input--disabled-static" id="field-applications-global">
                  Apply to all applications in the account
                </div>
              </div>
              <div class="applications-picker hidden" id="applications-picker">
                <button type="button" class="ekara-picker-field applications-picker-trigger" id="applications-picker-trigger" aria-haspopup="listbox" aria-expanded="false">
                  <span class="ekara-picker-field-label" id="applications-picker-label">Select applications</span>
                  <span class="ekara-picker-chevron" aria-hidden="true"></span>
                </button>
                <div class="applications-picker-menu hidden" id="applications-picker-menu" role="listbox">
                <label class="applications-picker-item">
                  <input type="checkbox" id="applications-select-all">
                  <span>Select all</span>
                </label>
                <label class="applications-picker-item">
                  <input type="checkbox" class="applications-option" value="3615-15_new">
                  <span>3615-15_new</span>
                </label>
                <label class="applications-picker-item">
                  <input type="checkbox" class="applications-option" value="3615-2">
                  <span>3615-2</span>
                </label>
                <label class="applications-picker-item">
                  <input type="checkbox" class="applications-option" value="Application cva">
                  <span>Application cva</span>
                </label>
                <label class="applications-picker-item">
                  <input type="checkbox" class="applications-option" value="Application demo">
                  <span>Application demo</span>
                </label>
                </div>
              </div>
            </div>
            <div class="form-error" id="error-applications"></div>
          </div>
        </div>

        <hr class="section-divider">

        <div class="form-row-inline-2 form-row-align-start">
          <div class="form-group">
            <label class="form-label" id="field-trigger-label">Alert trigger event</label>
            <div class="form-select-wrap" data-ekara-inline-select>
              <select class="form-select" id="field-trigger" aria-labelledby="field-trigger-label">
                <option value="Incident">Incident</option>
                <option value="Warning on availability">Warning on availability</option>
                <option value="Performance degradation">Performance degradation</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="field-time-wait">Time to wait</label>
            <input type="text" class="form-input" id="field-time-wait" value="00:00" inputmode="numeric">
            <div class="form-error" id="error-time-wait"></div>
          </div>
        </div>

        <div class="form-row-inline-2 form-row-align-start alert-end-gap-row">
          <div class="form-group alert-send-end-field">
            <span class="form-label">Send end of alert</span>
            <label class="toggle">
              <input type="checkbox" id="field-send-end">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="form-group">
            <label class="form-label" for="field-minimum-end-gap">Minimum gap</label>
            <input type="text" class="form-input" id="field-minimum-end-gap" value="00:00" inputmode="numeric" disabled>
            <div class="form-error" id="error-minimum-end-gap"></div>
          </div>
        </div>

        <hr class="section-divider">

        <div class="form-group">
          <span class="form-label">Days</span>
          <div class="day-pill-group" id="day-pills">
            <button type="button" class="day-pill active" data-day="Mon">Mon</button>
            <button type="button" class="day-pill active" data-day="Tue">Tue</button>
            <button type="button" class="day-pill active" data-day="Wed">Wed</button>
            <button type="button" class="day-pill active" data-day="Thu">Thu</button>
            <button type="button" class="day-pill active" data-day="Fri">Fri</button>
            <button type="button" class="day-pill active" data-day="Sat">Sat</button>
            <button type="button" class="day-pill active" data-day="Sun">Sun</button>
          </div>
          <div class="form-error" id="error-days"></div>
        </div>

        <div class="form-row-inline-3 form-row-align-start">
          <div class="form-group">
            <label class="form-label" for="field-starts">Starts</label>
            <input type="text" class="form-input" id="field-starts" value="00:00">
          </div>
          <div class="form-group">
            <label class="form-label" for="field-ends">Ends</label>
            <input type="text" class="form-input" id="field-ends" value="23:59">
          </div>
          <div class="form-group">
            <label class="form-label" id="field-timezone-label">Time zones</label>
            <div class="form-select-wrap" data-ekara-inline-select>
              <select class="form-select" id="field-timezone" aria-labelledby="field-timezone-label">
                <option value="Europe/Paris">Europe/Paris</option>
                <option value="Europe/Berlin">Europe/Berlin</option>
                <option value="UTC">UTC</option>
                <option value="America/New_York">America/New_York</option>
              </select>
            </div>
          </div>
        </div>

        <hr class="section-divider">

        <div class="form-row-inline-2 form-row-align-start channel-recipients-row">
          <div class="form-group">
            <span class="form-label">Channel</span>
            <div class="channel-options channel-options--stacked">
              <label class="channel-option">
                <input type="radio" name="channel" value="Email" checked>
                Email
              </label>
              <label class="channel-option">
                <input type="radio" name="channel" value="Sms">
                Sms
              </label>
              <label class="channel-option">
                <input type="radio" name="channel" value="Webhook">
                Webhook
              </label>
            </div>
          </div>
          <div class="form-group">
            <span class="form-label">Add recipients</span>
            <div class="recipients-picker" id="recipients-picker">
              <button type="button" class="ekara-picker-field recipients-field" id="recipients-field" aria-haspopup="listbox" aria-expanded="false">
                <span class="recipients-chips" id="recipients-chips"></span>
                <span class="recipients-placeholder" id="recipients-placeholder">Select recipients</span>
                <span class="ekara-picker-chevron recipients-chevron" aria-hidden="true"></span>
              </button>
              <div class="recipients-picker-menu hidden" id="recipients-picker-menu" role="listbox" aria-label="Recipients">
                <button type="button" class="recipients-picker-option" role="option" data-value="team-ops" data-label="Operations team">Operations team</button>
                <button type="button" class="recipients-picker-option" role="option" data-value="team-sre" data-label="SRE on-call">SRE on-call</button>
                <button type="button" class="recipients-picker-option" role="option" data-value="user-demo" data-label="demo@example.com">demo@example.com</button>
                <button type="button" class="recipients-picker-option" role="option" data-value="user-alerts" data-label="alerts@example.com">alerts@example.com</button>
              </div>
            </div>
            <div class="form-error" id="error-recipients"></div>
          </div>
        </div>
      </form>
    </div>

    <div class="slide-panel-footer">
      <button type="button" class="btn btn-text" id="btn-cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="btn-save">Save</button>
    </div>
  </div>

  <div class="modal-overlay modal-overlay--confirm" id="confirm-overlay"></div>
  <div class="confirm-dialog" id="confirm-dialog">
    <div class="confirm-dialog-title">Delete alert</div>
    <div class="confirm-dialog-message" id="confirm-message"></div>
    <div class="confirm-dialog-actions">
      <button type="button" class="btn btn-text" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirm-ok">Delete</button>
    </div>
  </div>

  <script src="../../assets/js/prototype-routes.js?v=1"></script>
  <script src="../../assets/js/settings-sidebar.js?v=2"></script>
  <script src="../../assets/js/bento.js?v=3"></script>
  <script src="../../assets/js/tooltip.js?v=3"></script>
  <script src="../../assets/js/ekara-inline-select.js?v=3"></script>
  <script src="../../assets/js/alerts.js?v=29"></script>
</body>
</html>
